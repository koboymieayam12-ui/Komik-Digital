<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Komik Digital</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Poppins", sans-serif;
        background-color: #f2f2f2;
        color: #333;
        transition: 0.3s;
    }

    body.dark {
        background-color: #1c1c1c;
        color: #eee;
    }

    /* Header */
    header {
        text-align: center;
        padding: 30px 20px;
        background: #ffd86b;
        border-bottom: 3px solid #e6c159;
        border-radius: 0 0 20px 20px;
    }

    header h1 {
        font-size: 32px;
        font-weight: 600;
    }

    header p {
        margin-top: 5px;
        opacity: 0.8;
        font-size: 15px;
    }

    #toggle-theme {
        margin-top: 12px;
        padding: 8px 18px;
        background: #fff;
        border: 2px solid #333;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    body.dark #toggle-theme {
        background: #333;
        color: #eee;
        border-color: #eee;
    }

    #toggle-theme:hover {
        transform: scale(1.05);
    }

    /* Comic container */
    .comic-container {
        width: 92%;
        max-width: 850px;
        margin: 30px auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .panel {
        background: white;
        border-radius: 10px;
        padding: 10px;
        border: 2px solid #ccc;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        cursor: zoom-in;
        transition: 0.2s;
    }

    .panel:hover {
        transform: translateY(-3px);
    }

    body.dark .panel {
        background: #2d2d2d;
        border-color: #555;
        box-shadow: 0 4px 10px rgba(255,255,255,0.08);
    }

    /* Gambar */
    .panel img {
        width: 100%;
        border-radius: 6px;
        transition: 0.3s ease;
    }

    .panel img:hover {
        transform: scale(1.02);
    }

    /* FULLSCREEN ZOOM */
    #zoom-view {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    #zoom-view img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    #zoom-view:active {
        display: none;
    }

    footer {
        text-align: center;
        margin: 40px 0 20px;
        opacity: 0.7;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    <h1>Komik Digital</h1>
    <p>"Pelita" Perjalanan Artha Menjelajahi Ke-tiga Candi</p>

    <button id="toggle-theme">🌙 Mode</button>
</header>

<!-- Zoom viewer -->
<div id="zoom-view" onclick="this.style.display='none'">
    <img id="zoom-img" src="">
</div>

<!-- Comic Images -->
<section class="comic-container">
    <div class="panel"><img src="image/cover.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page1.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page2.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page3.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page4.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page5.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page6.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page7.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page8.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page9.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page10.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page11.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page12.jpg" onclick="zoom(this.src)"></div>
    <div class="panel"><img src="image/page13.jpg" onclick="zoom(this.src)"></div>
</section>

<footer>
    Karya : Widya Puteri Istiarta✧👩🍭
</footer>

<script>
    const toggle = document.getElementById("toggle-theme");
    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
    });

    function zoom(src) {
        document.getElementById("zoom-img").src = src;
        document.getElementById("zoom-view").style.display = "flex";
    }
</script>

</body>
</html>
